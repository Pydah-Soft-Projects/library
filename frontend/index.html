    <!-- Centralized Theme Runtime Loader -->
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var server = isLocal ? 'http://localhost:7000' : 'https://ui-theme.pydah.edu.in';
        var s = document.createElement('script');
        s.src = server + '/themes/theme-loader.js';
        s.setAttribute('data-theme-server', server);
        s.setAttribute('data-poll-interval', isLocal ? '5' : '30');
        s.onerror = function() {
          if (isLocal) {
            var fb = document.createElement('script');
            fb.src = 'https://ui-theme.pydah.edu.in/themes/theme-loader.js';
            fb.setAttribute('data-theme-server', 'https://ui-theme.pydah.edu.in');
            fb.setAttribute('data-poll-interval', '30');
            document.head.appendChild(fb);
          }
        };
        document.head.appendChild(s);
      })();
    </script>
